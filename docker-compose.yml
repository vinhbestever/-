version: "3.9"

services:
  # ── Elasticsearch ────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Kibana (optional, for visualization) ─────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Kafka (KRaft mode, no Zookeeper) ─────────────────────────
  kafka:
    image: bitnami/kafka:3.9
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Call Log API ─────────────────────────────────────────────
  call-log-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CALLLOG_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - CALLLOG_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CALLLOG_ENRICHMENT_ENABLED=true
      - CALLLOG_LOG_LEVEL=INFO
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Enrichment Worker ────────────────────────────────────────
  enrichment-worker:
    build: .
    command: ["python", "-m", "app.workers.enrichment_worker"]
    environment:
      - CALLLOG_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - CALLLOG_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CALLLOG_LOG_LEVEL=INFO
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es_data:
  kafka_data:
